{{ define "main" }}
<div class="cerca">

  <header class="cerca__header">
    <h1 class="cerca__title">Cerca</h1>
    <p class="cerca__subtitle">
      Cerca qualsevol terme en els articles de l'arxiu
    </p>
  </header>

  <form class="cerca__form" role="search" onsubmit="return false;">
    <input
      type="search"
      id="cerca-input"
      class="cerca__input"
      placeholder="escriu un nom, un títol, una paraula…"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
      autofocus>
  </form>

  <p class="cerca__estat" id="cerca-estat" aria-live="polite">
    Carregant índex…
  </p>

  <section class="cerca__seccio" id="cerca-seccio-articles" hidden>
    <ul class="llista-articles" id="cerca-llista-articles"></ul>
  </section>

</div>

{{- $cercaJS := resources.Get "js/cerca.js" | minify | fingerprint -}}
<script src="{{ $cercaJS.RelPermalink }}" defer></script>

{{ end }}

{{ define "css-extra" }}
  {{- $c := resources.Get "css/cerca.css" | minify | fingerprint -}}
  <link rel="stylesheet" href="{{ $c.Permalink }}" integrity="{{ $c.Data.Integrity }}">
{{ end }}
