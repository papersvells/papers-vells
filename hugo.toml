baseURL           = 'https://papers-vells.pages.dev/'
locale            = 'ca'
title             = 'Papers Vells'
theme             = 'papersvells'
removePathAccents = true
preserveTaxonomyNames = true
enableRobotsTXT = true
capitalizeListTitles = false

[pagination]
  pagerSize = 1000

[taxonomies]
  autors       = 'autors'
  publicacions = 'publicacions'
  tags         = 'tags'
  categoria    = 'categoria'
  questions    = 'questions'

[params]
  description = "Arxiu d'articles de premsa antiga catalana"
  subtitol    = 'Articles de premsa antiga catalana'

[imaging]
  anchor         = 'Center'
  resampleFilter = 'box'
  quality        = 75
  hint           = 'photo'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name   = 'Inici'
  url    = '/'
  weight = 1

[[menus.main]]
  name   = 'Autors'
  url    = '/autors/'
  weight = 2

[[menus.main]]
  name       = 'Descobrir'
  identifier = 'descobrir'
  weight     = 3

[[menus.main]]
  name   = 'Publicacions'
  url    = '/publicacions/'
  parent = 'descobrir'
  weight = 1

[[menus.main]]
  name   = 'Cronologia'
  url    = '/cronologia/'
  parent = 'descobrir'
  weight = 2

[[menus.main]]
  name   = 'Qüestions'
  url    = '/questions/'
  parent = 'descobrir'
  weight = 3

[[menus.main]]
  name   = 'Categories'
  url    = '/categoria/'
  parent = 'descobrir'
  weight = 4

[[menus.main]]
  name   = 'Projecte'
  url    = '/projecte/'
  weight = 4

[permalinks]
  [permalinks.term]
    autors       = "/:slug/"
    publicacions = "/:slug/"
    categoria    = "/categoria/:slug/"
    questions    = "/questions/:slug/"

[minify]
  minifyOutput = true