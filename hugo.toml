baseURL           = 'https://papers-vells.pages.dev/'
locale            = 'ca'
title             = 'Papers Vells'
theme             = 'papersvells'
removePathAccents = true
preserveTaxonomyNames = true
enableRobotsTXT = true
capitalizeListTitles = false

[pagination]
  pagerSize = 1000

[taxonomies]
  autors       = 'autors'
  publicacions = 'publicacions'
  tags         = 'tags'
  categoria    = 'categoria'
  questions    = 'questions'

[params]
  description = "Arxiu d'articles de premsa antiga catalana"
  subtitol    = 'Articles de premsa antiga catalana'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name   = 'Inici'
  url    = '/'
  weight = 1

[[menus.main]]
  name   = 'Autors'
  url    = '/autors/'
  weight = 2

[[menus.main]]
  name   = 'Publicacions'
  url    = '/publicacions/'
  weight = 3

[[menus.main]]
  name   = 'Qüestions'
  url    = '/questions/'
  weight = 4

[[menus.main]]
  name   = 'Categories'
  url    = '/categoria/'
  weight = 5

[[menus.main]]
  name   = 'Cronologia'
  url    = '/cronologia/'
  weight = 6

[[menus.main]]
  name   = 'Diari'
  url    = '/el-diari/'
  weight = 7

[permalinks]
  [permalinks.term]
    autors       = "/:slug/"
    publicacions = "/:slug/"
    categoria    = "/categoria/:slug/"
    questions    = "/questions/:slug/"

[minify]
  minifyOutput = true