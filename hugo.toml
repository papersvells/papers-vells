baseURL           = 'https://papers-vells.pages.dev/'
locale            = 'ca'
title             = 'Papers Vells'
theme             = 'papersvells'
removePathAccents = true
preserveTaxonomyNames = true
enableRobotsTXT = true

[pagination]
  pagerSize = 1000

[taxonomies]
  autors      = 'autors'
  publicacions = 'publicacions'
  tags        = 'tags'

[params]
  description = "Arxiu d'articles de premsa antiga catalana"
  subtitol    = 'Articles de premsa antiga catalana'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name   = 'Articles'
  url    = '/'
  weight = 1

[[menus.main]]
  name   = 'El diari'
  url    = '/el-diari/'
  weight = 2

[[menus.main]]
  name   = 'Autors'
  url    = '/autors/'
  weight = 3

[[menus.main]]
  name   = 'Publicacions'
  url    = '/publicacions/'
  weight = 4

[permalinks]
  [permalinks.term]
    autors       = "/:slug/"
    publicacions = "/:slug/"

[minify]
  minifyOutput = true
